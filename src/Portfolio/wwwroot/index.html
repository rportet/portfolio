<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <script>
        // https://getbootstrap.com/docs/5.3/customize/color-modes/#javascript
        // Copyright 2011-2025 The Bootstrap Authors, licensed under CC BY 3.0.
        (() => {
            'use strict'

            const darkQuery = window.matchMedia('(prefers-color-scheme: dark)')

            const getStoredTheme = () => {
                try {
                    const theme = localStorage.getItem('theme')
                    return theme === 'light' || theme === 'dark' ? theme : null
                } catch {
                    return null
                }
            }

            const getPreferredTheme = () => getStoredTheme() ?? (darkQuery.matches ? 'dark' : 'light')

            document.documentElement.setAttribute('data-bs-theme', getPreferredTheme())

            darkQuery.addEventListener('change', () => {
                if (!getStoredTheme()) {
                    document.documentElement.setAttribute('data-bs-theme', getPreferredTheme())
                }
            })
        })()
    </script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preload" href="fonts/figtree/figtree-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bricolage-grotesque/bricolage-grotesque-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link href="Portfolio.styles.css" rel="stylesheet" />
    <script type="text/javascript">
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
